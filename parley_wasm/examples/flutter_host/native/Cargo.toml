[package]
name = "parley_flutter_host"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0 OR MIT"
description = "C FFI bridge embedding Wasmtime + vello_cpu so Flutter (macOS/iOS/Linux/Windows/Android) can run parley.wasm."

[workspace]

[lib]
crate-type = ["cdylib", "staticlib"]

[dependencies]
vello_cpu = { version = "0.2.0", default-features = false, features = ["std", "u8_pipeline", "text"] }
peniko = { version = "0.6.1", default-features = false, features = ["std"] }

# Desktop & Android: Cranelift JIT for near-native speed.
[target.'cfg(not(target_os = "ios"))'.dependencies]
wasmtime = { version = "49.0.0", default-features = false, features = ["runtime", "component-model", "cranelift", "std"] }

# iOS: Pulley bytecode interpreter (zero JIT, 100% iOS / App Store compliant).
[target.'cfg(target_os = "ios")'.dependencies]
wasmtime = { version = "49.0.0", default-features = false, features = ["runtime", "component-model", "cranelift", "pulley", "std"] }
